services:
  - type: worker
    name: it404-develop-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BOT_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_INSTALLATION_ID
        sync: false
      - key: GITHUB_OWNER
        value: Zuno-inc
      - key: GITHUB_REPO
        value: Zuno
      - key: PROJECT_URL
        value: https://zuno-com.onrender.com/
