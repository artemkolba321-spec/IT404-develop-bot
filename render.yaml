services:
  - type: worker
    name: it404-develop-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: it404-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_INSTALLATION_ID
        sync: false
      - key: GITHUB_OWNER
        value: Zuno-inc
      - key: GITHUB_REPO
        value: Zuno
      - key: DATABASE_PATH
        value: /var/data/requests.sqlite
      - key: PROJECT_URL
        value: https://zuno-com.onrender.com/
