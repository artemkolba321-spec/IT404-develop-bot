services:
  - type: web
    name: it404-develop-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.webhook:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BOT_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_INSTALLATION_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: GITHUB_OWNER
        value: Zuno-inc
      - key: GITHUB_REPO
        value: Zuno
      - key: PROJECT_URL
        value: https://zuno-com.onrender.com/
